name: Check PDF export candidate

on:
  push:
    branches: [diagnostics/ios-build-021]

permissions:
  contents: read

env:
  CANDIDATE_COMMIT: 2f733a4c9b8c4684c78c1de3465dd39630f42fa2

jobs:
  sdk-check:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compile and link the candidate against the iOS 26.0 SDK
        shell: bash
        run: |
          export DEVELOPER_DIR=/Applications/Xcode_26.0.1.app/Contents/Developer
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos swiftc --version
          scratch=$(mktemp -d)
          source="$scratch/source"
          output="$scratch/output"
          mkdir "$output"
          git worktree add --detach "$source" "$CANDIDATE_COMMIT"
          trap 'git worktree remove --force "$source"' EXIT
          actual_commit=$(git -C "$source" rev-parse HEAD)
          test "$actual_commit" = "$CANDIDATE_COMMIT"
          echo "Checking AIWorkbookKit commit $actual_commit"
          xcrun swift package --package-path "$source" dump-package
          cat > "$scratch/MyApp.swift" <<'SWIFT'
          import SwiftUI

          @main
          struct MyApp: App {
              var body: some Scene {
                  WindowGroup { ContentView() }
              }
          }
          SWIFT
          xcrun --sdk iphoneos swiftc -emit-module -emit-object -parse-as-library \
            -whole-module-optimization -swift-version 5 \
            -target arm64-apple-ios26.0 -sdk "$sdk" -module-name AIWorkbookKit \
            -Xfrontend -warn-long-expression-type-checking=500 \
            -emit-module-path "$output/AIWorkbookKit.swiftmodule" \
            -o "$output/AIWorkbookKit.o" "$source"/Sources/AIWorkbookKit/*.swift
          xcrun --sdk iphoneos swiftc -swift-version 5 -target arm64-apple-ios26.0 \
            -sdk "$sdk" -I "$output" -o "$output/AIWorkbook" \
            "$scratch/MyApp.swift" "$source/Integration/ContentView.swift" "$output/AIWorkbookKit.o"
          echo "$actual_commit compiled and linked"

  simulator-export:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exercise PDF export on an iPad simulator
        shell: bash
        run: |
          xcodebuild -version
          scratch=$(mktemp -d)
          source="$scratch/source"
          git worktree add --detach "$source" "$CANDIDATE_COMMIT"
          trap 'git worktree remove --force "$source"' EXIT
          actual_commit=$(git -C "$source" rev-parse HEAD)
          test "$actual_commit" = "$CANDIDATE_COMMIT"
          echo "Testing AIWorkbookKit commit $actual_commit"
          mkdir -p "$source/Tests/AIWorkbookKitTests"
          cp Diagnostics/WorkbookPDFExportTests.swift "$source/Tests/AIWorkbookKitTests/"
          python3 - "$source/Package.swift" <<'PYTHON'
          from pathlib import Path
          import sys
          manifest = Path(sys.argv[1])
          source = manifest.read_text()
          target = '.target(name: "AIWorkbookKit")'
          assert source.count(target) == 1
          manifest.write_text(source.replace(target, target + ',\n        .testTarget(name: "AIWorkbookKitTests", dependencies: ["AIWorkbookKit"])'))
          PYTHON
          device_id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, key=lambda label: tuple(int(n) for n in label.split(".iOS-")[-1].split("-")) if ".iOS-" in label else (), reverse=True):
              if ".iOS-" not in runtime:
                  continue
              for device in devices[runtime]:
                  if device["name"].startswith("iPad"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No iPad simulator is available")
          ')
          cd "$source"
          xcodebuild -scheme AIWorkbookKit -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath "$scratch/derived" -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO test
